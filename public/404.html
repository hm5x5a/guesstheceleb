<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Not Found | Guess The Celeb</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--ink:#10131f;--card:#fff;--blue:#2d3cff;--sun:#ffc933;--mut:#5b6177}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f1c;--ink:#f1f2fa;--card:#181b30;--mut:#9aa0ba}}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:40px 30px;max-width:500px;width:100%}
h1{font-size:clamp(3rem,8vw,5rem);margin:0 0 10px;line-height:1;font-weight:800}
p{color:var(--mut);margin:0 0 24px;font-size:1.1rem}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;border:3px solid var(--ink);border-radius:12px;padding:12px 24px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>
<div class="card">
  <h1>404</h1>
  <h2>Celebrity Not Found</h2>
  <p>The page or game mode you are looking for does not exist or has moved.</p>
  <a href="/" class="btn">Back to Daily Game</a>
</div>
</body>
</html>
